services:
  - type: web
    name: lunarhorizon-api
    runtime: python
    plan: free            # change to "starter" ($7/mo) to avoid the ~50 s cold start after idle
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ALLOW_ORIGINS
        value: https://lunarhorizonsite.xyz,https://www.lunarhorizonsite.xyz
      - key: OPENROUTER_API_KEY   # optional: enables the Ask Rover AI answers
        sync: false
