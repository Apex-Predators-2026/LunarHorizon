# Build and test on every push and pull request: catches integration mistakes (a broken import, a failing
# test, a type error, a build that doesn't bundle). Deliberately small; the full release gate (real missions,
# production build in a browser, offline demo) is `node scripts/release-gate.mjs`, run on a prepared machine.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      LUNAR_OFFLINE: "1" # the tests use the committed site files only; no Moon Trek / JPL downloads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npx vitest run
      - run: npm run build # tsc -b + vite build
