# Publish the frontend to GitHub Pages on every push to main (and on demand from the Actions tab).
# The site is served at https://apex-predators-2026.github.io/LunarHorizon/ and talks to the Render backend.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The backend the site talks to (the paid Render service). To switch hosts, change it here.
      # A trailing slash is removed: the app appends "/api/...", and "//api/..." is a 404.
      - run: |
          url="${RAW_API_URL%/}"
          echo "Backend: $url"
          echo "VITE_API_URL=$url" >> "$GITHUB_ENV"
        env:
          RAW_API_URL: https://lunarhorizon-api-aget.onrender.com
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/ # a project site lives in a subfolder named after the repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
